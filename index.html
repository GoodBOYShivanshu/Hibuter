<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hibxy is a small, fast habit tracker with streaks, heatmaps and weekly insights. Your data never leaves the browser."
    />
    <meta name="theme-color" content="#0b0b12" />
    <title>Hibxy — build small streaks</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      try {
        var saved = JSON.parse(localStorage.getItem('hibxy.state.v1') || 'null')
        if (saved && saved.theme === 'light') document.documentElement.dataset.theme = 'light'
      } catch (error) {
        /* ignore */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
